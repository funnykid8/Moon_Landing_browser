name: Refresh NASA Horizons data
on:
  schedule: [{ cron: '0 3 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/fetch-horizons.js 120
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/ephem.json
          git commit -m "Refresh NASA Horizons data" || echo "no changes"
          git push
